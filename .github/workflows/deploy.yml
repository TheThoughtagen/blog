name: Deploy site

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-herenow
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Refresh public GitHub stats
        run: node scripts/github-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish to here.now
        run: node scripts/deploy.mjs
        env:
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
